<!-- Outfit is loaded as a webfont rather than relied on as an installed
     system font. Safari restricts CSS access to locally installed fonts as a
     fingerprinting defence, so `font-family: Outfit` on reactable tables
     would otherwise fall back to the default serif (Times). Only the tables and
     charts use Outfit; page text keeps the cosmo theme font (as on the NFL
     site). Included on every page via `_site.yml`; changing it means re-rendering every page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
